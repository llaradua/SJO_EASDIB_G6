<!DOCTYPE html>
<html lang="es">
<!--AVISO NO TOCAR NINGÚN ID DEL FORMULARIO NI NINGÚN NAME DE DENTRO DEL FORMULARIO SI ALGUIEN LO HACE 🐶🔫 EL PERRO MUERE😡 
(y el encargado del backend se tira de un quinto piso)-->
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="normalize.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>1Pike | Píkate</title>

</head>

<body>

    <div class="contenedor_global">

        <header>

            <div class="header_contenido">

                <a href="index.html">
                    <div class="logo">
                        <img src="img/1pike_rojo.png" alt="LOGO" width="120" height="100">
                    </div>
                </a>

                <div class="header_contenido">

                    <div class="logo">
                        <img src="img/1pike_rojo.png" alt="LOGO" width="0" height="0">
                    </div>

                    <!--MENÚ HAMBURGUESA-->
                    <nav id="menú_nav">
                        <!--CHECKBOX DE CONTROL-->
                        <label for="hamburguesa">&#9776;</label>
                        <input type="checkbox" id="hamburguesa">
                        <!--DESPLEGABLE-->
                        <div id="menú_items">
                            <a href="pikate.html">Píkate</a>
                            <a href="pikados.html">Los pikados</a>
                            <a href="clubes.html">Clubes</a>
                            <a href="marcas.html">Marcas</a>
                        </div>

                    </nav>

                </div>

        </header>
        <div class="formulario_deportista">
            <form id="alta_profile">
                <h2>Comparte tu recorrido</h2>
                <input type="text" id="nombre" placeholder="Nombre del club" required>

               <select id="disciplina" required>
                    <option value="">Seleccione Disciplina...</option>
                    <option value="ArtesMarciales">Artes marciales</option>
                    <option value="Atletismo">Atletismo</option>
                    <option value="Automovilismo">Automovilismo</option>
                    <option value="Deportes acuáticos">Deportes acuáticos</option>
                    <option value="Deportes de equipo">Deportes de equipo</option>
                    <option value="Deportes de fuerza">Deportes de fuerza</option>
                    <option value="Deportes de invierno">Deportes de invierno</option>
                    <option value="Deportes de precisión">Deportes de precisión</option>
                    <option value="Deportes de raqueta">Deportes de raqueta</option>
                    <option value="Gimnasia">Gimnasia</option>
                </select>

<textarea id="descripcion" style="display:none"></textarea>

                <input type="text" id="deporte" placeholder="Deporte" required>

                <input type="text" id="direccion" placeholder="Dirección" required>

                <input type="text" id="localidad" placeholder="Localidad" required>

                <input type="text" id="provincia" placeholder="Provincia" required>

                <input type="email" id="correo_electronico" placeholder="e-mail" required>

                <input type="tel" id="telefono" placeholder="Telf" required>

                <input type="url" id="redes_sociales" placeholder="URL redes sociales">
                <input type="file" id="files" name="files">

                <div class="botones_accion">
                <input id="upload-button" type="submit" value="ENVIAR">
                <button type="button" id="cancel-edit" style="display:none;">Cancelar Edición</button>
            </div>
            </form>

        </div>
        <ul id="clubes-list">
            <li class="pet-item"></li>
        </ul>
    </div>
    <script src="appclubes.js" defer></script>

</body>

</html>
